services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fym-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "${SQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - fym-net

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: fym-api
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=FyMUsersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Seed__SuperAdmin__UserName: ${SEED_SUPERADMIN_USERNAME}
      Seed__SuperAdmin__Email: ${SEED_SUPERADMIN_EMAIL}
      Seed__SuperAdmin__Password: ${SEED_SUPERADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS}
      Cookies__Secure: ${COOKIES_SECURE}
      Database__AutoMigrate: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fym-net

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    container_name: fym-web
    environment:
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fym-net

networks:
  fym-net:

volumes:
  mssql-data:
