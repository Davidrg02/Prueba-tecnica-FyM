<div class="fym-page">
  <fym-page-header title="Roles" subtitle="Defina roles y los permisos que agrupan">
    @if (canCreate) {
      <a actions mat-flat-button color="primary" routerLink="/roles/new">
        <mat-icon>add</mat-icon>
        Nuevo rol
      </a>
    }
  </fym-page-header>

  <div class="fym-card table-card">
    @if (loading()) {
      <div class="loading-row">
        <mat-spinner diameter="32" />
      </div>
    } @else if (roles().length === 0) {
      <fym-empty-state icon="admin_panel_settings" title="No hay roles registrados" />
    } @else {
      <div class="table-scroll">
        <table mat-table [dataSource]="roles()">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let role">
              <a class="role-name" [routerLink]="['/roles', role.id]">
                {{ role.name }}
                @if (role.isSystem) {
                  <mat-icon class="lock-icon" matTooltip="Rol del sistema">lock</mat-icon>
                }
              </a>
            </td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let role">{{ role.description }}</td>
          </ng-container>

          <ng-container matColumnDef="level">
            <th mat-header-cell *matHeaderCellDef>Nivel</th>
            <td mat-cell *matCellDef="let role">{{ role.level }}</td>
          </ng-container>

          <ng-container matColumnDef="userCount">
            <th mat-header-cell *matHeaderCellDef>Usuarios</th>
            <td mat-cell *matCellDef="let role">{{ role.userCount }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef aria-label="Acciones"></th>
            <td mat-cell *matCellDef="let role">
              <a mat-icon-button [routerLink]="['/roles', role.id]" matTooltip="Ver / editar permisos">
                <mat-icon>tune</mat-icon>
              </a>
              @if (canDelete && !role.isSystem) {
                <button mat-icon-button matTooltip="Eliminar" (click)="deleteRole(role)">
                  <mat-icon>delete</mat-icon>
                </button>
              }
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  </div>
</div>
