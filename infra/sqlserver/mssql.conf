; Configuración de SQL Server para el modo de conexión "endurecido"
; (ver docs/security.md). No se usa por defecto: docker-compose.yml no
; monta este archivo salvo que se active explícitamente SQL_TLS_MODE=strict,
; porque requiere haber generado antes los certificados con
; infra/certs/generate-certs.sh y montarlos en /etc/ssl/mssql dentro del
; contenedor de sqlserver.
[network]
forceencryption = 1
tlsprotocols = 1.2
tlscert = /etc/ssl/mssql/mssql.crt
tlskey = /etc/ssl/mssql/mssql.key
